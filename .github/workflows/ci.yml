name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ibm8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ibm8/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Verify generated client is committed
        run: git diff --exit-code -- public
